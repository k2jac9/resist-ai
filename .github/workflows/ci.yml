name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        # Single source of truth for the pin lives in requirements-dev.txt.
        run: pip install "$(grep -E '^ruff' requirements-dev.txt)"

      - name: Ruff lint
        run: ruff check src/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt pulls in requirements.txt + pytest.
          # Heavy ML deps (requirements-ml.txt) are intentionally omitted;
          # ESM-2 falls back to a sequence heuristic when absent.
          pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run tests
        env:
          RDKIT_SILENCE_DEPRECATION: "1"
        run: pytest -q
