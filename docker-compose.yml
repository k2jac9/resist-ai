version: "3.9"

services:
  web:
    build: .
    command: ["web"]
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - SERVICE=web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  api:
    build: .
    command: ["api"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SERVICE=api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
