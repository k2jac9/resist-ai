services:
  web:
    build: .
    command: ["web"]
    ports:
      - "7860:7860"
    env_file:
      - path: .env
        required: false
    environment:
      - SERVICE=web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  api:
    build: .
    command: ["api"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - SERVICE=api
      # Auth/CORS are read from .env when present. The API fails closed:
      # set RESISTAI_API_KEY to enable it, or RESISTAI_ALLOW_NO_AUTH=true for
      # local dev. RESISTAI_CORS_ORIGINS is a comma-separated allowlist.
      - RESISTAI_API_KEY=${RESISTAI_API_KEY:-}
      - RESISTAI_ALLOW_NO_AUTH=${RESISTAI_ALLOW_NO_AUTH:-}
      - RESISTAI_CORS_ORIGINS=${RESISTAI_CORS_ORIGINS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
